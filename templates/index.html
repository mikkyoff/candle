<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candles + BB Bandwidth — 10s · EURGBP / EURUSD / AUDUSD (OTC)</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, sans-serif; background: #0d1017; color: #d1d4dc; }
  #header {
    padding: 8px 18px; background: #161b22;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2e39; flex-wrap: wrap; gap: 8px;
  }
  #header .title { font-size: 14px; font-weight: 600; }
  #header select {
    background: #1e222d; color: #d1d4dc; border: 1px solid #2a2e39;
    border-radius: 4px; padding: 4px 8px; font-size: 12px;
  }
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .ok { background: #26a69a; color: white; }
  .err { background: #ef5350; color: white; }
  .warn { background: #f0a500; color: white; }
  #diag {
    padding: 4px 18px; background: #161b22;
    font-family: ui-monospace, monospace; font-size: 11px;
    color: #787b86; border-bottom: 1px solid #2a2e39;
    white-space: pre-wrap; line-height: 1.4;
  }
  #main { display: flex; flex-direction: column; height: calc(100vh - 84px); }
  #pricePane { flex: 2 1 0; min-height: 0; }
  #bwPane    { flex: 1 1 0; min-height: 0; border-top: 1px solid #2a2e39; }
  #tableWrap {
    flex: 0 0 auto; display: flex; gap: 1px;
    background: #2a2e39; border-top: 1px solid #2a2e39;
  }
  .assetCard {
    flex: 1 1 0; min-width: 180px; background: #1e222d;
    padding: 8px 14px; display: flex; flex-direction: column; gap: 2px;
    border-top: 3px solid transparent;
  }
  .assetCard .name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
  .assetCard .bw { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .assetCard .meta { font-size: 11px; color: #787b86; font-variant-numeric: tabular-nums; }
  .pos { color: #26a69a; } .neg { color: #ef5350; } .neutral { color: #d1d4dc; }
</style>
</head>
<body>

<div id="header">
  <div class="title">Candles + BB Bandwidth — 10s · 20-period · 2σ</div>
  <select id="assetPicker"></select>
  <div id="status"><span class="badge warn">Connecting...</span></div>
</div>

<div id="diag">boot</div>

<div id="main">
  <div id="pricePane"></div>
  <div id="bwPane"></div>
  <div id="tableWrap"></div>
</div>

<script>
const PALETTE = ["#26a69a", "#2962ff", "#e91e63", "#f0a500"];
const fmt = (n, d = 5) => (n == null || isNaN(n)) ? "—" : Number(n).toFixed(d);

const pricePane = document.getElementById("pricePane");
const bwPane    = document.getElementById("bwPane");
const tableWrap = document.getElementById("tableWrap");
const statusEl  = document.getElementById("status");
const diagEl    = document.getElementById("diag");
const pickerEl  = document.getElementById("assetPicker");

// ---- Two charts, horizontally synced ----
const priceChart = LightweightCharts.createChart(pricePane, {
  layout: { background: { color: "#0d1017" }, textColor: "#d1d4dc" },
  grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
  timeScale: { timeVisible: true, secondsVisible: true, borderColor: "#2a2e39" },
  rightPriceScale: { borderColor: "#2a2e39" },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});

const bwChart = LightweightCharts.createChart(bwPane, {
  layout: { background: { color: "#0d1017" }, textColor: "#d1d4dc" },
  grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
  timeScale: { timeVisible: true, secondsVisible: true, borderColor: "#2a2e39" },
  rightPriceScale: { borderColor: "#2a2e39" },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});

// Sync time scales both directions.
let syncing = false;
function syncCharts(a, b) {
  a.timeScale().subscribeVisibleTimeRangeChange(range => {
    if (syncing || !range) return;
    syncing = true;
    try { b.timeScale().setVisibleRange(range); } catch (e) {}
    syncing = false;
  });
}
syncCharts(priceChart, bwChart);
syncCharts(bwChart, priceChart);

const candleSeries = priceChart.addCandlestickSeries({
  upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
  wickUpColor: "#26a69a", wickDownColor: "#ef5350",
});

const bwSeriesByAsset = {};
function ensureBwSeries(asset, index) {
  if (bwSeriesByAsset[asset]) return bwSeriesByAsset[asset];
  const s = bwChart.addLineSeries({
    color: PALETTE[index % PALETTE.length],
    lineWidth: 2,
    priceLineVisible: false,
    lastValueVisible: true,
    title: asset,
  });
  bwSeriesByAsset[asset] = s;
  return s;
}

// ---- State ----
let initialFit = false;
let cardsBuilt = false;
let selectedAsset = null;

function buildPicker(assets) {
  pickerEl.innerHTML = "";
  assets.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a.asset;
    opt.textContent = a.asset;
    pickerEl.appendChild(opt);
  });
  selectedAsset = assets[0]?.asset || null;
  pickerEl.value = selectedAsset;
  pickerEl.addEventListener("change", () => {
    selectedAsset = pickerEl.value;
    initialFit = false;
    candleSeries.setData([]);
  });
}

function buildCards(assets) {
  tableWrap.innerHTML = "";
  assets.forEach((a, i) => {
    const card = document.createElement("div");
    card.className = "assetCard";
    card.style.borderTopColor = PALETTE[i % PALETTE.length];
    card.innerHTML = `
      <div class="name" style="color:${PALETTE[i % PALETTE.length]}">${a.asset}</div>
      <div class="bw neutral" id="bw-${a.asset}">warming up</div>
      <div class="meta" id="meta-${a.asset}">—</div>
    `;
    tableWrap.appendChild(card);
  });
  cardsBuilt = true;
}

function setStatus(kind, text) {
  statusEl.innerHTML = `<span class="badge ${kind}">${text}</span>`;
}

async function tick() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const snap = await res.json();

    if (!snap || !Array.isArray(snap.assets)) {
      setStatus("err", "BAD PAYLOAD");
      diagEl.textContent = JSON.stringify(snap).slice(0, 400);
      return;
    }

    if (!cardsBuilt) { buildPicker(snap.assets); buildCards(snap.assets); }

    const anyTicks = snap.assets.some(a => a.ticks > 0);
    if (snap.error && !anyTicks) {
      setStatus("err", `ERROR: ${snap.error}`);
    } else if (!anyTicks) {
      setStatus("warn", "WARMING UP — waiting for first ticks");
    } else if (!snap.connected) {
      setStatus("warn", "DISCONNECTED — reconnecting");
    } else {
      const age = snap.last_tick_age_s != null ? `${snap.last_tick_age_s}s` : "—";
      setStatus("ok", `LIVE · ${snap.timeframe}s bars · last tick ${age}`);
    }

    const lines = [];
    snap.assets.forEach(a => {
      lines.push(
        `${a.asset}: ticks=${a.ticks} bars=${a.closed_count} ` +
        `bw_pts=${a.bandwidth_series.length}` +
        (a.sub_error ? ` err=${a.sub_error}` : "")
      );
    });
    lines.push(
      `http=${res.status} connected=${snap.connected} ` +
      `uptime=${snap.uptime_s}s selected=${selectedAsset}`
    );
    if (snap.error) lines.push(`server_err=${snap.error}`);
    diagEl.textContent = lines.join("\n");

    // --- Candle pane: selected asset only ---
    const sel = snap.assets.find(a => a.asset === selectedAsset) || snap.assets[0];
    if (sel) {
      if (sel.candles.length) candleSeries.setData(sel.candles);
      const last = sel.forming || sel.candles[sel.candles.length - 1];
      if (last) candleSeries.update(last);
    }

    // --- Bandwidth pane: all assets ---
    snap.assets.forEach((a, i) => {
      const s = ensureBwSeries(a.asset, i);
      if (a.bandwidth_series.length) s.setData(a.bandwidth_series);

      const bwEl = document.getElementById(`bw-${a.asset}`);
      const metaEl = document.getElementById(`meta-${a.asset}`);
      if (bwEl) {
        bwEl.textContent = a.bandwidth_pct == null
          ? "warming up"
          : `${a.bandwidth_pct.toFixed(4)}%`;
        bwEl.className = "bw " + (a.bandwidth_pct == null ? "neutral" : "pos");
      }
      if (metaEl) {
        const idle = a.last_tick_ts > 0
          ? `${(Date.now() / 1000 - a.last_tick_ts).toFixed(1)}s ago`
          : "—";
        metaEl.textContent = `${a.closed_count} bars · ${a.ticks} ticks · ${idle}`;
      }
    });

    const anyBw = snap.assets.some(a => a.bandwidth_series.length > 1);
    if (!initialFit && anyBw) {
      priceChart.timeScale().fitContent();
      bwChart.timeScale().fitContent();
      initialFit = true;
    } else if (initialFit) {
      priceChart.timeScale().scrollToRealTime();
      bwChart.timeScale().scrollToRealTime();
    }

  } catch (e) {
    setStatus("err", `CLIENT: ${e.message}`);
    diagEl.textContent = `fetch failed: ${e.message}`;
  }
}

tick();
setInterval(tick, 1000);

function resizeAll() {
  priceChart.applyOptions({
    width: pricePane.clientWidth,
    height: pricePane.clientHeight,
  });
  bwChart.applyOptions({
    width: bwPane.clientWidth,
    height: bwPane.clientHeight,
  });
}
window.addEventListener("resize", resizeAll);
setTimeout(resizeAll, 100);
</script>
</body>
</html>
