<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EURCHF_otc — 15s Live Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, sans-serif; background: #0d1017; color: #d1d4dc; }
  #header {
    padding: 10px 18px; background: #161b22;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2e39; flex-wrap: wrap; gap: 8px;
  }
  #header .title { font-size: 14px; font-weight: 600; }
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .ok { background: #26a69a; color: white; }
  .err { background: #ef5350; color: white; }
  .warn { background: #f0a500; color: white; }
  #chartWrap { display: flex; flex-direction: column; height: calc(100vh - 48px); }
  #chart { flex: 1 1 auto; min-height: 0; width: 100%; }
  #indicatorBar {
    flex: 0 0 auto; display: flex; gap: 1px;
    background: #2a2e39; border-top: 1px solid #2a2e39;
  }
  .card {
    flex: 1 1 0; min-width: 150px; background: #1e222d;
    padding: 8px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  .card .label { font-size: 10px; letter-spacing: 1px; color: #787b86; text-transform: uppercase; }
  .card .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 11px; color: #787b86; }
  .pos { color: #26a69a; } .neg { color: #ef5350; } .neutral { color: #d1d4dc; }
</style>
</head>
<body>

<div id="header">
  <div class="title">EURCHF_otc — 15s Live Chart</div>
  <div id="status"><span class="badge warn">Connecting...</span></div>
</div>

<div id="chartWrap">
  <div id="chart"></div>
  <div id="indicatorBar">
    <div class="card">
      <span class="label">RSI (14)</span>
      <span class="value" id="rsiVal">—</span>
      <span class="sub" id="rsiSub">warming up</span>
    </div>
    <div class="card">
      <span class="label">EMA (6)</span>
      <span class="value" id="emaVal">—</span>
      <span class="sub">Price vs EMA</span>
    </div>
    <div class="card">
      <span class="label">BB Upper (20, 2σ)</span>
      <span class="value" id="bbUpVal">—</span>
    </div>
    <div class="card">
      <span class="label">BB Middle</span>
      <span class="value" id="bbMidVal">—</span>
    </div>
    <div class="card">
      <span class="label">BB Lower</span>
      <span class="value" id="bbLoVal">—</span>
    </div>
  </div>
</div>

<script>
function computeRSI(closes, period = 14) {
  if (closes.length < period + 1) return null;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d >= 0) gains += d; else losses += -d;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    const gain = d > 0 ? d : 0;
    const loss = d < 0 ? -d : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
  }
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - 100 / (1 + rs);
}

function computeBollinger(closes, period = 20, mult = 2) {
  if (closes.length < period) return [null, null, null];
  const win = closes.slice(-period);
  const mean = win.reduce((a, b) => a + b, 0) / period;
  const variance = win.reduce((a, b) => a + (b - mean) ** 2, 0) / period;
  const sd = Math.sqrt(variance);
  return [mean + mult * sd, mean, mean - mult * sd];
}

function computeEMA(closes, period = 6) {
  if (closes.length < period) return null;
  const k = 2 / (period + 1);
  let ema = closes.slice(0, period).reduce((a, b) => a + b, 0) / period;
  for (let i = period; i < closes.length; i++) {
    ema = closes[i] * k + ema * (1 - k);
  }
  return ema;
}

const chartContainer = document.getElementById("chart");
const statusEl = document.getElementById("status");

const chart = LightweightCharts.createChart(chartContainer, {
  layout: { background: { color: "#0d1017" }, textColor: "#d1d4dc" },
  grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
  timeScale: { timeVisible: true, secondsVisible: true, borderColor: "#2a2e39" },
  rightPriceScale: { borderColor: "#2a2e39" },
});

const candleSeries = chart.addCandlestickSeries({
  upColor: "#26a69a", downColor: "#ef5350", borderVisible: false,
  wickUpColor: "#26a69a", wickDownColor: "#ef5350",
});
const bbUpperSeries = chart.addLineSeries({ color: "#2962ff", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const bbMiddleSeries = chart.addLineSeries({ color: "#f0a500", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
const bbLowerSeries = chart.addLineSeries({ color: "#2962ff", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const emaSeries = chart.addLineSeries({ color: "#e91e63", lineWidth: 2, priceLineVisible: false });

let initialFit = false;
const fmt = (n, d = 5) => (n == null || isNaN(n)) ? "—" : Number(n).toFixed(d);

function buildIndicatorLines(candles) {
  const closes = candles.map(c => c.close);
  const bbU = [], bbM = [], bbL = [], ema = [];
  for (let i = 0; i < candles.length; i++) {
    const slice = closes.slice(0, i + 1);
    const [u, m, l] = computeBollinger(slice);
    if (u != null) {
      bbU.push({ time: candles[i].time, value: u });
      bbM.push({ time: candles[i].time, value: m });
      bbL.push({ time: candles[i].time, value: l });
    }
    const ev = computeEMA(slice);
    if (ev != null) ema.push({ time: candles[i].time, value: ev });
  }
  return { bbU, bbM, bbL, ema };
}

function setStatus(kind, text) {
  statusEl.innerHTML = `<span class="badge ${kind}">${text}</span>`;
}

async function tick() {
  try {
    const res = await fetch("/api/candles", { cache: "no-store" });
    const snap = await res.json();

    if (snap.error && !snap.candles.length) {
      setStatus("err", `ERROR: ${snap.error}`);
      return;
    }
    if (!snap.candles.length) {
      setStatus("warn", "WARMING UP — waiting for first 15s bar");
      return;
    }
    if (!snap.connected) {
      setStatus("warn", "DISCONNECTED — reconnecting");
    } else {
      const age = snap.last_tick_age_s != null ? `${snap.last_tick_age_s}s` : "—";
      const gaps = snap.gaps_remaining > 0 ? ` · gaps ${snap.gaps_remaining}` : "";
      setStatus("ok", `LIVE · ${snap.candles.length} bars · last bar ${age}${gaps}`);
    }

    const candles = snap.candles;

    candleSeries.setData(candles);

    const lines = buildIndicatorLines(candles);
    bbUpperSeries.setData(lines.bbU);
    bbMiddleSeries.setData(lines.bbM);
    bbLowerSeries.setData(lines.bbL);
    emaSeries.setData(lines.ema);

    if (!initialFit && candles.length >= 2) {
      chart.timeScale().fitContent();
      initialFit = true;
    } else if (initialFit) {
      chart.timeScale().scrollToRealTime();
    }

    const closes = candles.map(c => c.close);
    const rsi = computeRSI(closes);
    const [bbU, bbM, bbL] = computeBollinger(closes);
    const ema = computeEMA(closes);
    const price = closes[closes.length - 1];

    const rsiEl = document.getElementById("rsiVal");
    rsiEl.textContent = rsi == null ? "—" : rsi.toFixed(2);
    rsiEl.className = "value " + (rsi == null ? "neutral" : rsi >= 70 ? "neg" : rsi <= 30 ? "pos" : "neutral");
    document.getElementById("rsiSub").textContent =
      rsi == null ? "warming up" : rsi >= 70 ? "Overbought" : rsi <= 30 ? "Oversold" : "Neutral";

    document.getElementById("emaVal").textContent = fmt(ema);
    document.getElementById("emaVal").className =
      "value " + (ema == null ? "neutral" : price > ema ? "pos" : "neg");

    document.getElementById("bbUpVal").textContent = fmt(bbU);
    document.getElementById("bbMidVal").textContent = fmt(bbM);
    document.getElementById("bbLoVal").textContent = fmt(bbL);

  } catch (e) {
    setStatus("err", `CLIENT: ${e.message}`);
  }
}

tick();
setInterval(tick, 1000);

window.addEventListener("resize", () => {
  chart.applyOptions({
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight,
  });
});
</script>
</body>
</html>
