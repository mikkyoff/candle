<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BB Bandwidth — 10s · EURGBP / EURUSD / AUDUSD (OTC)</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, sans-serif; background: #0d1017; color: #d1d4dc; }
  #header {
    padding: 10px 18px; background: #161b22;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2e39; flex-wrap: wrap; gap: 8px;
  }
  #header .title { font-size: 14px; font-weight: 600; }
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .ok { background: #26a69a; color: white; }
  .err { background: #ef5350; color: white; }
  .warn { background: #f0a500; color: white; }
  #diag {
    padding: 6px 18px; background: #161b22;
    font-family: ui-monospace, monospace; font-size: 11px;
    color: #787b86; border-bottom: 1px solid #2a2e39;
    white-space: pre-wrap;
  }
  #chartWrap { display: flex; flex-direction: column; height: calc(100vh - 82px); }
  #chart { flex: 1 1 auto; min-height: 0; width: 100%; }
  #tableWrap {
    flex: 0 0 auto; display: flex; gap: 1px;
    background: #2a2e39; border-top: 1px solid #2a2e39;
  }
  .assetCard {
    flex: 1 1 0; min-width: 200px; background: #1e222d;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 4px;
    border-top: 3px solid transparent;
  }
  .assetCard .name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
  .assetCard .bw { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .assetCard .meta { font-size: 11px; color: #787b86; font-variant-numeric: tabular-nums; }
  .pos { color: #26a69a; } .neg { color: #ef5350; } .neutral { color: #d1d4dc; }
</style>
</head>
<body>

<div id="header">
  <div class="title">BB Bandwidth — 10s · 20-period · 2σ</div>
  <div id="status"><span class="badge warn">Connecting...</span></div>
</div>

<div id="diag">boot</div>

<div id="chartWrap">
  <div id="chart"></div>
  <div id="tableWrap"></div>
</div>

<script>
const PALETTE = ["#26a69a", "#2962ff", "#e91e63", "#f0a500"];
const fmt = (n, d = 4) =>
  (n == null || isNaN(n)) ? "—" : Number(n).toFixed(d);

const chartContainer = document.getElementById("chart");
const statusEl = document.getElementById("status");
const tableWrap = document.getElementById("tableWrap");
const diagEl = document.getElementById("diag");

const chart = LightweightCharts.createChart(chartContainer, {
  layout: { background: { color: "#0d1017" }, textColor: "#d1d4dc" },
  grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
  timeScale: { timeVisible: true, secondsVisible: true, borderColor: "#2a2e39" },
  rightPriceScale: { borderColor: "#2a2e39" },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});

const seriesByAsset = {};
let initialFit = false;
let cardsBuilt = false;

function ensureSeries(asset, index) {
  if (seriesByAsset[asset]) return seriesByAsset[asset];
  const color = PALETTE[index % PALETTE.length];
  const s = chart.addLineSeries({
    color, lineWidth: 2,
    priceLineVisible: false, lastValueVisible: true,
    title: asset,
  });
  seriesByAsset[asset] = s;
  return s;
}

function buildCards(assets) {
  tableWrap.innerHTML = "";
  assets.forEach((a, i) => {
    const card = document.createElement("div");
    card.className = "assetCard";
    card.style.borderTopColor = PALETTE[i % PALETTE.length];
    card.innerHTML = `
      <div class="name" style="color:${PALETTE[i % PALETTE.length]}">${a.asset}</div>
      <div class="bw neutral" id="bw-${a.asset}">warming up</div>
      <div class="meta" id="meta-${a.asset}">—</div>
    `;
    tableWrap.appendChild(card);
  });
  cardsBuilt = true;
}

function setStatus(kind, text) {
  statusEl.innerHTML = `<span class="badge ${kind}">${text}</span>`;
}

function setDiag(text) {
  diagEl.textContent = text;
}

async function tick() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const snap = await res.json();

    if (!snap || !Array.isArray(snap.assets)) {
      setStatus("err", "BAD PAYLOAD");
      setDiag(`response status=${res.status} body=${JSON.stringify(snap).slice(0, 400)}`);
      return;
    }

    if (!cardsBuilt) buildCards(snap.assets);

    const anyTicks = snap.assets.some(a => a.ticks > 0);

    if (snap.error && !anyTicks) {
      setStatus("err", `ERROR: ${snap.error}`);
    } else if (!anyTicks) {
      setStatus("warn", "WARMING UP — waiting for first ticks");
    } else if (!snap.connected) {
      setStatus("warn", "DISCONNECTED — reconnecting");
    } else {
      const age = snap.last_tick_age_s != null
        ? `${snap.last_tick_age_s}s` : "—";
      setStatus("ok", `LIVE · 10s bars · last tick ${age}`);
    }

    const parts = [];
    snap.assets.forEach(a => {
      parts.push(
        `${a.asset}: ticks=${a.ticks} bars=${a.closed_count} ` +
        `bw_pts=${a.bandwidth_series.length} ` +
        `err=${a.sub_error || "none"}`
      );
    });
    parts.push(
      `http=${res.status} connected=${snap.connected} ` +
      `snapshots=${snap.snapshots} uptime=${snap.uptime_s}s`
    );
    if (snap.error) parts.push(`server_err=${snap.error}`);
    setDiag(parts.join("\n"));

    snap.assets.forEach((a, i) => {
      const series = ensureSeries(a.asset, i);
      if (a.bandwidth_series.length) {
        series.setData(a.bandwidth_series);
      }

      const bwEl = document.getElementById(`bw-${a.asset}`);
      const metaEl = document.getElementById(`meta-${a.asset}`);
      if (bwEl) {
        bwEl.textContent = a.bandwidth_pct == null
          ? "warming up"
          : `${a.bandwidth_pct.toFixed(4)}%`;
        bwEl.className = "bw " + (a.bandwidth_pct == null ? "neutral" : "pos");
      }
      if (metaEl) {
        const idle = a.last_tick_ts > 0
          ? `${(Date.now() / 1000 - a.last_tick_ts).toFixed(1)}s ago`
          : "—";
        metaEl.textContent =
          `${a.closed_count} bars · ${a.ticks} ticks · last ${idle}`;
      }
    });

    if (!initialFit && snap.assets.some(a => a.bandwidth_series.length > 2)) {
      chart.timeScale().fitContent();
      initialFit = true;
    } else if (initialFit) {
      chart.timeScale().scrollToRealTime();
    }

  } catch (e) {
    setStatus("err", `CLIENT: ${e.message}`);
    setDiag(`fetch failed: ${e.message}`);
  }
}

tick();
setInterval(tick, 1000);

window.addEventListener("resize", () => {
  chart.applyOptions({
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight,
  });
});
</script>
</body>
</html>
